name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # The protocol/statistics/report layer and the shipped packs are checked
    # without torch; rollouts need the `run` extra and are not part of CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q
