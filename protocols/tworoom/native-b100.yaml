schema: wm-eval/protocol@0
id: tworoom/native-b100
description: >
  Same planner as repo-k25, but start and goal are whatever the environment
  itself samples at reset (agent and target uniformly placed, often in
  opposite rooms), with a 100-step budget.
notes: >
  Action normalization is the StandardScaler fit on the released dataset as
  published in sahnas/stigmergic-module-routing
  (results/lewm_kaggle/.../tworoom/released_mean_seed42/solver_and_normalization.json);
  scripts/check_norm.py re-derives it from expert rollouts as a cross-check.
env:
  id: swm/TwoRoom-v1
  image_size: 224
episodes:
  count: 200
  seed: 42
  construction: env_native
eval_budget: 100
normalization:
  action:
    mean: [0.0030934159554243212, -0.05298253984909538]
    std: [0.867547357428919, 0.8686383074906906]
planner:
  solver: cem
  objective: goal_mse
  num_samples: 300
  n_steps: 30
  topk: 30
  var_scale: 1.0
  horizon: 5
  receding_horizon: 5
  action_block: 5
  history_len: 1
  warm_start: true
  batch_size: 1
  seed: 42
run:
  batch_size: 50
